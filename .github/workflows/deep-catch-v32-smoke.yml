name: Deep Catch V3.2 Final Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-catch-v32-smoke.yml'
      - '_deployment/deep-catch-v32-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-catch-v32-final
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public HTTP
        id: http
        continue-on-error: true
        shell: bash
        env:
          URL: https://alnaimistudio.github.io/aippy/games/deep-catch/
        run: |
          set -euo pipefail
          ok=0
          for i in {1..40}; do
            code=$(curl -L -sS -o /tmp/deep-v32.html -w '%{http_code}' --max-time 30 "$URL" || true)
            bytes=$(wc -c </tmp/deep-v32.html 2>/dev/null || echo 0)
            echo "HTTP_ATTEMPT=$i CODE=$code BYTES=$bytes"
            if [ "$code" = "200" ] && grep -q 'Deep Catch — V3.2' /tmp/deep-v32.html && grep -q 'fish-url-fixes.js?v=3.2' /tmp/deep-v32.html; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
          curl -fsSL --max-time 30 'https://alnaimistudio.github.io/aippy/games/deep-catch/assets/fish/leviathan-whale.webp?v=3.2' -o /tmp/whale.webp
          curl -fsSL --max-time 30 'https://alnaimistudio.github.io/aippy/games/deep-catch/assets/fish/reef-glider.webp?v=3.2' -o /tmp/reef.webp
          curl -fsSL --max-time 30 'https://alnaimistudio.github.io/aippy/games/deep-catch/assets/fish/spike-puffer.webp?v=3.2' -o /tmp/puffer.webp
          curl -fsSL --max-time 30 'https://alnaimistudio.github.io/aippy/games/deep-catch/assets/fish/sunstripe-runner.webp?v=3.2' -o /tmp/sun.webp
          test -s /tmp/whale.webp
          test -s /tmp/reef.webp
          test -s /tmp/puffer.webp
          test -s /tmp/sun.webp
          echo 'PUBLIC_HTTP_OK=1'

      - name: Verify mobile gameplay in Chromium
        id: browser
        continue-on-error: true
        shell: bash
        env:
          URL: https://alnaimistudio.github.io/aippy/games/deep-catch/
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-v32
          npm install --prefix /tmp/pw-v32 --no-save playwright@1.55.0 >/tmp/pw-v32-npm.log 2>&1
          /tmp/pw-v32/node_modules/.bin/playwright install chromium >/tmp/pw-v32-install.log 2>&1
          NODE_PATH=/tmp/pw-v32/node_modules node <<'JS'
          const { chromium } = require('playwright');
          const url=process.env.URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function verify(){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            const pageErrors=[]; const consoleErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text())) consoleErrors.push(m.text())});
            page.on('requestfailed',r=>{if(!/favicon/i.test(r.url())) failed.push(r.url()+' :: '+(r.failure()?.errorText||'failed'))});
            let response=null;
            for(let i=1;i<=30;i++){
              try{response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});}catch(e){}
              if(response?.ok() && (await page.title()).includes('V3.2')) break;
              await sleep(3000);
            }
            if(!response?.ok()) throw new Error('FINAL_URL_HTTP_FAILURE');
            await page.locator('#play').waitFor({state:'visible',timeout:60000});
            const assetCheck=await page.evaluate(async()=>{
              async function validate(map){
                const entries=Object.entries(map||{}),bad=[];
                for(const [key,src] of entries){
                  if(typeof src!=='string'||!src){bad.push(key+':source');continue;}
                  const img=new Image(); img.src=src;
                  try{await img.decode(); if(!img.naturalWidth||!img.naturalHeight) bad.push(key+':zero-size');}
                  catch(e){bad.push(key+':decode:'+String(src).slice(0,80));}
                }
                return {count:entries.length,bad};
              }
              return {fish:await validate(window.FISH_ASSETS_DATA),rods:await validate(window.ROD_ASSETS)};
            });
            if(assetCheck.fish.count!==10||assetCheck.fish.bad.length) throw new Error('FISH_ASSETS '+JSON.stringify(assetCheck.fish));
            if(assetCheck.rods.count<8||assetCheck.rods.bad.length) throw new Error('ROD_ASSETS '+JSON.stringify(assetCheck.rods));

            await page.locator('#play').click();
            await page.locator('#act').waitFor({state:'visible',timeout:15000});
            const initial=(await page.locator('#act').textContent()||'').trim();
            if(initial!=='CAST') throw new Error('EXPECTED_CAST GOT_'+initial);

            await page.locator('#shopQuick').click();
            await page.locator('#shop.open').waitFor({state:'visible',timeout:10000});
            const cards=await page.locator('#shopGrid .shopCard').count();
            if(cards<8) throw new Error('SHOP_CARDS_'+cards);
            const rodImgs=page.locator('#shopGrid .shopCard img');
            const rodImageCount=await rodImgs.count();
            for(let i=0;i<rodImageCount;i++){
              const ok=await rodImgs.nth(i).evaluate(img=>img.complete&&img.naturalWidth>0);
              if(!ok) throw new Error('SHOP_ROD_IMAGE_'+i+'_FAILED');
            }
            await page.locator('#closeShop').click();

            await page.locator('#act').click();
            await sleep(1500);
            const action=(await page.locator('#act').textContent()||'').trim();
            if(!['GUIDE','REEL'].includes(action)) throw new Error('CAST_STATE_'+action);
            const canvas=page.locator('#c');
            for(const pos of [{x:90,y:430},{x:290,y:500},{x:200,y:610},{x:130,y:540}]){
              await canvas.click({position:pos}); await sleep(220);
            }
            await sleep(1000);
            const score=Number((await page.locator('#score').textContent()||'0').trim());
            const coins=Number((await page.locator('#coins').textContent()||'0').trim());
            if(!Number.isFinite(score)||!Number.isFinite(coins)) throw new Error('INVALID_HUD');
            if(pageErrors.length) throw new Error('PAGEERROR '+pageErrors.join(' | '));
            if(consoleErrors.length) throw new Error('CONSOLE '+consoleErrors.join(' | '));
            if(failed.length) throw new Error('REQUESTFAILED '+failed.join(' | '));
            await page.screenshot({path:'/tmp/deep-catch-v32-final.png',fullPage:true});
            console.log(`VERIFY_OK=1 FISH=${assetCheck.fish.count} RODS=${assetCheck.rods.count} CARDS=${cards} ACTION=${action} SCORE=${score} COINS=${coins}`);
            console.log('FINAL_URL='+url);
            await browser.close();
          }
          verify().catch(e=>{console.error('VERIFY_FAIL='+e.stack);process.exit(1)});
          JS

      - name: Record Deep Catch V3.2 verification
        if: always()
        shell: bash
        env:
          HTTP_RESULT: ${{ steps.http.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail
          mkdir -p _deployment
          cat > _deployment/deep-catch-v32.json <<EOF
          {
            "game": "Deep Catch V3.2",
            "url": "https://alnaimistudio.github.io/aippy/games/deep-catch/",
            "run_id": "${GITHUB_RUN_ID}",
            "public_http": "$HTTP_RESULT",
            "browser_gameplay": "$BROWSER_RESULT",
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _deployment/deep-catch-v32.json
          git commit -m 'chore: record Deep Catch V3.2 verification [skip ci]' || exit 0
          git push

      - name: Final gate
        if: always()
        shell: bash
        run: |
          test '${{ steps.http.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
