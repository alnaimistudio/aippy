name: Ninja Climb Manual Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ninja-climb-manual-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static game checks
        shell: bash
        run: |
          set -euo pipefail
          test -s ninja-climb/index.html
          test -s ninja-climb/style.css
          test -s ninja-climb/game.js
          test -s ninja-climb/play.html
          node --check ninja-climb/game.js
          grep -q '<title>Ninja Climb</title>' ninja-climb/play.html
          grep -q 'id="startBtn"' ninja-climb/play.html
          grep -q 'requestAnimationFrame(loop)' ninja-climb/play.html
          grep -q '__NINJA_ART_EMBEDDED__' ninja-climb/play.html
          echo 'STATIC_CHECKS_OK'

      - name: Mobile browser smoke test
        shell: bash
        env:
          PLAY_URL: https://html-preview.github.io/?url=https://github.com/alnaimistudio/aippy/blob/main/ninja-climb/play.html
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-save playwright@1.55.0 >/dev/null 2>&1
          /tmp/pw/node_modules/.bin/playwright install chromium >/dev/null 2>&1
          NODE_PATH=/tmp/pw/node_modules node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto(process.env.PLAY_URL,{waitUntil:'domcontentloaded',timeout:60000});
            if (!response || !response.ok()) throw new Error('Public preview HTTP failure');
            await page.locator('#startBtn').waitFor({state:'visible',timeout:60000});
            await page.locator('#startBtn').click();
            await page.locator('#hud:not(.hidden)').waitFor({state:'visible',timeout:15000});
            const canvas = page.locator('#game');
            for (let i=0;i<6;i++) {
              await canvas.click({position:{x:195,y:520}});
              await page.waitForTimeout(160);
            }
            await page.waitForTimeout(800);
            const altitude = Number(await page.locator('#altitude').textContent());
            if (!(altitude > 0)) throw new Error('Gameplay did not progress');
            if (errors.length) throw new Error(errors.join(' | '));
            console.log('PUBLIC_GAME_OK ALTITUDE='+altitude);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
