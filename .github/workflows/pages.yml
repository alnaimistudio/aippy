name: Verify Ninja Climb Public Preview

on:
  push:
    branches: [main]
    paths-ignore:
      - '_deployment/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ninja-climb-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static game checks
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s ninja-climb/index.html
          test -s ninja-climb/style.css
          test -s ninja-climb/game.js
          node --check ninja-climb/game.js
          grep -q 'id="game"' ninja-climb/index.html
          grep -q 'id="startBtn"' ninja-climb/index.html
          grep -q 'src="game.js"' ninja-climb/index.html
          grep -q 'href="style.css"' ninja-climb/index.html

      - name: Local and public browser gameplay smoke test
        id: browser
        continue-on-error: true
        shell: bash
        env:
          PUBLIC_URL: https://htmlpreview.github.io/?https://github.com/alnaimistudio/aippy/blob/main/ninja-climb/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory . >/tmp/ninja-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4174/ninja-climb/ >/dev/null && break
            sleep 1
          done
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-save playwright@1.55.0 >/tmp/playwright-npm.log 2>&1
          /tmp/pw/node_modules/.bin/playwright install chromium >/tmp/playwright-install.log 2>&1
          NODE_PATH=/tmp/pw/node_modules node <<'JS'
          const { chromium } = require('playwright');
          const publicUrl = process.env.PUBLIC_URL;
          async function verify(page, url, label) {
            const errors=[];
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
            if (!response || !response.ok()) throw new Error(label+': HTTP failure');
            await page.locator('#startBtn').waitFor({state:'visible', timeout:60000});
            await page.locator('#startBtn').click();
            await page.locator('#hud:not(.hidden)').waitFor({state:'visible', timeout:10000});
            const canvas = page.locator('#game');
            if (await canvas.count() !== 1) throw new Error(label+': canvas missing');
            for (let i=0;i<7;i++) {
              await canvas.click({position:{x:195,y:520}});
              await page.waitForTimeout(150);
            }
            await page.waitForTimeout(900);
            const altitude = Number(await page.locator('#altitude').textContent());
            if (!Number.isFinite(altitude) || altitude <= 0) throw new Error(label+': altitude did not progress');
            if (errors.length) throw new Error(label+': '+errors.join(' | '));
            return altitude;
          }
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:390,height:844}, isMobile:true, hasTouch:true});
            const local = await context.newPage();
            const localAltitude = await verify(local, 'http://127.0.0.1:4174/ninja-climb/', 'local');
            await local.screenshot({path:'/tmp/ninja-local.png'});
            await local.close();
            const remote = await context.newPage();
            const remoteAltitude = await verify(remote, publicUrl, 'public');
            await remote.screenshot({path:'/tmp/ninja-public.png'});
            console.log('LOCAL_ALTITUDE='+localAltitude);
            console.log('PUBLIC_ALTITUDE='+remoteAltitude);
            console.log('PUBLIC_URL='+publicUrl);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

      - name: Public HTTP checks
        id: public_http
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://github.com/alnaimistudio/aippy/blob/main/ninja-climb/index.html' -o /tmp/github-game.html
          grep -q 'Ninja Climb' /tmp/github-game.html
          curl -fsSL --max-time 30 'https://raw.githubusercontent.com/alnaimistudio/aippy/main/ninja-climb/game.js' -o /tmp/public-game.js
          node --check /tmp/public-game.js

      - name: Record verification result
        if: always()
        shell: bash
        env:
          STATIC_RESULT: ${{ steps.static.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          HTTP_RESULT: ${{ steps.public_http.outcome }}
        run: |
          set -euo pipefail
          mkdir -p _deployment
          cat > _deployment/ninja-climb.json <<EOF
          {
            "game": "Ninja Climb",
            "url": "https://htmlpreview.github.io/?https://github.com/alnaimistudio/aippy/blob/main/ninja-climb/index.html",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "static_checks": "$STATIC_RESULT",
            "browser_gameplay": "$BROWSER_RESULT",
            "public_http": "$HTTP_RESULT",
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _deployment/ninja-climb.json
          git commit -m 'chore: record Ninja Climb verification [skip ci]' || exit 0
          git push

      - name: Fail if any verification failed
        if: always()
        shell: bash
        run: |
          test '${{ steps.static.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
          test '${{ steps.public_http.outcome }}' = 'success'
