name: Forest Stalker Mobile Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'games/forest-stalker/**'
      - '.github/workflows/forest-stalker-smoke.yml'
  workflow_dispatch:

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Test published mobile game
        run: |
          cat > /tmp/fs-test.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport:{width:390,height:844},
            deviceScaleFactor:3,
            isMobile:true,
            hasTouch:true,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          });
          const page = await context.newPage();
          const consoleErrors=[]; const pageErrors=[]; const failed=[];
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
          const url='https://alnaimistudio.github.io/aippy/games/forest-stalker/?qa='+Date.now();
          const response=await page.goto(url,{waitUntil:'networkidle',timeout:45000});
          if(!response || response.status()>=400) throw new Error('Page HTTP '+(response?.status()??'NO_RESPONSE'));
          const title=await page.title();
          console.log('TITLE',title);
          if(!title.includes('Forest Stalker')) throw new Error('Wrong page title');
          await page.waitForFunction(()=>{
            const b=document.querySelector('#start'); return b && !b.disabled && /START HUNT/i.test(b.textContent||'');
          },null,{timeout:30000});
          const webgl=await page.evaluate(()=>!!document.querySelector('#g')?.getContext('webgl2')||!!document.querySelector('#g')?.getContext('webgl'));
          if(!webgl) throw new Error('WebGL unavailable');
          await page.locator('#start').tap();
          await page.waitForTimeout(1200);
          const deerState=await page.evaluate(()=>window.__forestStalker?.state?.()||null);
          console.log('GAME_STATE',JSON.stringify(deerState));
          if(deerState && typeof deerState.alive==='number' && deerState.alive<1) throw new Error('No live deer');
          const perf=await page.evaluate(async()=>{
            const times=[]; let prev=performance.now(); const start=prev;
            await new Promise(resolve=>{
              function f(t){times.push(t-prev);prev=t;if(t-start<7000)requestAnimationFrame(f);else resolve();}
              requestAnimationFrame(f);
            });
            const good=times.filter(x=>x>0);good.sort((a,b)=>a-b);
            const avg=good.reduce((a,b)=>a+b,0)/Math.max(1,good.length);
            const p95=good[Math.floor(good.length*.95)]||0;
            const max=Math.max(...good);
            return {frames:good.length,fps:1000/avg,p95,max,heap:performance.memory?.usedJSHeapSize||null};
          });
          console.log('PERF',JSON.stringify(perf));
          if(perf.frames<200 || perf.fps<40) throw new Error('Low frame rate '+perf.fps.toFixed(1));
          if(perf.p95>45) throw new Error('Frame pacing p95 too high '+perf.p95.toFixed(1)+'ms');
          // rotate scope repeatedly to exercise 360-degree input
          for(let i=0;i<6;i++){
            await page.mouse.move(300,420); await page.mouse.down(); await page.mouse.move(80,420,{steps:8}); await page.mouse.up();
          }
          // fire exactly 5 rounds, then reload
          for(let i=0;i<5;i++){ await page.locator('#fire').tap(); await page.waitForTimeout(900); }
          const ammo0=await page.locator('#ammo').textContent(); console.log('AMMO_AFTER_5',ammo0);
          if((ammo0||'').trim()!=='0') throw new Error('Expected empty 5-round magazine');
          await page.locator('#reload').tap(); await page.waitForTimeout(2200);
          const ammo5=await page.locator('#ammo').textContent(); console.log('AMMO_AFTER_RELOAD',ammo5);
          if((ammo5||'').trim()!=='5') throw new Error('Reload did not restore 5 rounds');
          await page.locator('#shopBtn').tap(); await page.waitForTimeout(300);
          const shopOpen=await page.locator('#shop').evaluate(el=>el.classList.contains('open'));
          if(!shopOpen) throw new Error('Shop did not open');
          await page.locator('#closeShop').tap();
          console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors));
          console.log('PAGE_ERRORS',JSON.stringify(pageErrors));
          console.log('REQUEST_FAILED',JSON.stringify(failed));
          const relevantFailed=failed.filter(x=>!x.includes('favicon'));
          if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
          if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));
          if(relevantFailed.length) throw new Error('Failed requests: '+relevantFailed.join(' | '));
          await browser.close();
          JS
          node /tmp/fs-test.mjs
