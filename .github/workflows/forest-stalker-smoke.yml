name: Forest Stalker Mobile Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'games/forest-stalker/**'
      - '.github/workflows/forest-stalker-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Test published mobile game
        run: |
          cat > /tmp/fs-test.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const report={testedAt:new Date().toISOString(),url:'',pass:false,problems:[],consoleErrors:[],pageErrors:[],requestFailed:[]};
          let browser;
          try{
            browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push(m.text())});
            page.on('pageerror',e=>report.pageErrors.push(String(e)));
            page.on('requestfailed',r=>report.requestFailed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            report.url='https://alnaimistudio.github.io/aippy/games/forest-stalker/?qa='+Date.now();
            const navStart=Date.now();
            const response=await page.goto(report.url,{waitUntil:'networkidle',timeout:45000});
            report.loadMs=Date.now()-navStart;
            report.httpStatus=response?.status()??null;
            if(!response||response.status()>=400)report.problems.push('Page HTTP '+(response?.status()??'NO_RESPONSE'));
            report.title=await page.title();
            const readyStart=Date.now();
            try{
              await page.waitForFunction(()=>{const b=document.querySelector('#start');return b&&!b.disabled&&/START HUNT/i.test(b.textContent||'')},null,{timeout:30000});
              report.startReadyMs=Date.now()-readyStart;
            }catch(e){report.problems.push('START not ready: '+String(e));}
            report.webgl=await page.evaluate(()=>!!document.querySelector('#g')?.getContext('webgl2')||!!document.querySelector('#g')?.getContext('webgl'));
            if(!report.webgl)report.problems.push('WebGL unavailable');
            if(report.problems.length===0){
              await page.locator('#start').tap();await page.waitForTimeout(1200);
              report.gameState=await page.evaluate(()=>window.__forestStalker?.state?.()||null);
              if(report.gameState&&typeof report.gameState.alive==='number'&&report.gameState.alive<1)report.problems.push('No live deer');
              report.perf=await page.evaluate(async()=>{
                const times=[];let prev=performance.now(),start=prev;
                await new Promise(resolve=>{function f(t){times.push(t-prev);prev=t;if(t-start<7000)requestAnimationFrame(f);else resolve()}requestAnimationFrame(f)});
                const good=times.filter(x=>x>0).sort((a,b)=>a-b);const avg=good.reduce((a,b)=>a+b,0)/Math.max(1,good.length);
                return{frames:good.length,fps:1000/avg,p95:good[Math.floor(good.length*.95)]||0,max:Math.max(...good),heap:performance.memory?.usedJSHeapSize||null};
              });
              if(report.perf.frames<200||report.perf.fps<40)report.problems.push('Low FPS '+report.perf.fps.toFixed(1));
              if(report.perf.p95>45)report.problems.push('Frame pacing p95 '+report.perf.p95.toFixed(1)+'ms');
              for(let i=0;i<6;i++){await page.mouse.move(300,420);await page.mouse.down();await page.mouse.move(80,420,{steps:8});await page.mouse.up()}
              for(let i=0;i<5;i++){await page.locator('#fire').tap();await page.waitForTimeout(900)}
              report.ammoAfter5=(await page.locator('#ammo').textContent()||'').trim();
              if(report.ammoAfter5!=='0')report.problems.push('Magazine did not reach 0 after 5 shots');
              await page.locator('#reload').tap();await page.waitForTimeout(2300);
              report.ammoAfterReload=(await page.locator('#ammo').textContent()||'').trim();
              if(report.ammoAfterReload!=='5')report.problems.push('Reload did not restore 5 rounds');
              await page.locator('#shopBtn').tap();await page.waitForTimeout(300);
              report.shopOpen=await page.locator('#shop').evaluate(el=>el.classList.contains('open'));
              if(!report.shopOpen)report.problems.push('Shop did not open');
              if(report.shopOpen)await page.locator('#closeShop').tap();
            }
            const relevantFailed=report.requestFailed.filter(x=>!x.includes('favicon'));
            if(report.pageErrors.length)report.problems.push('Page errors: '+report.pageErrors.join(' | '));
            if(report.consoleErrors.length)report.problems.push('Console errors: '+report.consoleErrors.join(' | '));
            if(relevantFailed.length)report.problems.push('Failed requests: '+relevantFailed.join(' | '));
            report.pass=report.problems.length===0;
          }catch(e){report.problems.push('Fatal: '+String(e));report.pass=false}
          finally{if(browser)await browser.close();fs.mkdirSync('.qa',{recursive:true});fs.writeFileSync('.qa/forest-stalker-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));}
          JS
          node /tmp/fs-test.mjs
      - name: Commit QA report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .qa/forest-stalker-report.json
          git commit -m "Update Forest Stalker QA report" || exit 0
          git push
      - name: Enforce QA result
        run: |
          node -e "const r=require('./.qa/forest-stalker-report.json'); if(!r.pass){console.error(r.problems); process.exit(1)}"
