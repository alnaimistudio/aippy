<style>
:root{--bg:#06111f;--panel:#0b1b30;--panel2:#10243d;--line:#203553;--text:#f5f8ff;--muted:#8493aa;--cyan:#22d3ee;--blue:#2386ff;--purple:#7c3aed;--green:#13d7a5;--danger:#ff4d67;--bubble:#123253;--mine:#0b6b60;--shadow:0 20px 60px rgba(0,0,0,.38)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -10%,#12396d 0,#071426 32%,#040b14 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100%;max-width:520px;margin:auto;background:linear-gradient(180deg,rgba(7,20,38,.98),rgba(5,13,25,.99));position:relative;overflow:hidden;box-shadow:var(--shadow)}.safe-top{height:max(env(safe-area-inset-top),12px)}.logo{width:78px;height:78px;border-radius:24px;background:linear-gradient(145deg,#092f6a,#5a22df 68%,#22d3ee);display:grid;place-items:center;box-shadow:0 12px 40px rgba(62,100,255,.35),inset 0 0 0 1px rgba(255,255,255,.18)}.logo svg{width:58px;height:58px}.brand-name{font-weight:900;letter-spacing:.1em;font-size:28px}.brand-sub{color:var(--muted);font-size:12px;letter-spacing:.25em;margin-top:3px}.welcome{min-height:100vh;padding:10vh 26px 34px;display:flex;flex-direction:column;align-items:center}.welcome .logo{width:108px;height:108px;border-radius:31px}.welcome .logo svg{width:80px;height:80px}.welcome h1{margin:26px 0 4px;font-size:34px}.welcome p{color:var(--muted);text-align:center;line-height:1.6;margin:8px 0 34px}.card{width:100%;background:linear-gradient(180deg,rgba(15,35,60,.95),rgba(8,23,40,.95));border:1px solid rgba(125,166,224,.16);border-radius:24px;padding:20px}.field{margin:13px 0}.field label{font-size:12px;color:#a9b6ca;display:block;margin-bottom:8px}.field input{width:100%;border:1px solid #25405f;background:#08192c;color:#fff;border-radius:14px;padding:15px 14px;outline:none}.field input:focus{border-color:#397aff;box-shadow:0 0 0 3px rgba(57,122,255,.13)}.btn{border:0;border-radius:15px;padding:14px 16px;font-weight:800;color:white;background:#172a43;cursor:pointer}.btn.primary{width:100%;background:linear-gradient(90deg,#13c8f0,#6b37f7);box-shadow:0 8px 24px rgba(74,77,244,.25)}.btn.ghost{width:100%;margin-top:10px;background:transparent;border:1px solid #253b58;color:#bdd0e8}.demo-note{font-size:11px;color:#73839b;text-align:center;margin-top:16px}.topbar{height:70px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(6,17,31,.94);border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:0;z-index:9;backdrop-filter:blur(18px)}.top-left{display:flex;align-items:center;gap:11px}.mini-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#0863c8,#6b35ed 70%,#13d7e8);display:grid;place-items:center}.mini-logo svg{width:29px;height:29px}.title{font-weight:850;font-size:22px}.subtitle{font-size:12px;color:var(--muted);margin-top:1px}.icon-btn{width:40px;height:40px;border-radius:13px;border:0;background:#10233b;color:#dcecff;display:grid;place-items:center;font-size:19px}.content{padding-bottom:82px}.search-row{display:flex;gap:9px;padding:12px 14px}.search{flex:1;background:#0d2037;border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:12px 14px;color:#fff;outline:none}.filter-row{display:flex;gap:7px;padding:0 14px 10px;overflow:auto}.chip{white-space:nowrap;border:0;border-radius:20px;padding:7px 12px;color:#9eb0c9;background:#10233a;font-size:12px}.chip.active{color:#fff;background:linear-gradient(90deg,#296eff,#6a3bf4)}.list{padding:0 10px}.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer}.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;position:relative;background:linear-gradient(145deg,#1b769c,#5739dc)}.avatar.online:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#17d59a;border:2px solid #071426;right:0;bottom:1px}.row-main{min-width:0;flex:1}.row-top{display:flex;justify-content:space-between;gap:10px}.row-name{font-weight:780}.row-time{font-size:11px;color:#6f829d}.preview{color:#8fa1b9;font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin-top:5px}.unread{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:#1d85ff;display:grid;place-items:center;font-size:11px;font-weight:900}.bottom{height:75px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(5,15,27,.96);border-top:1px solid rgba(255,255,255,.07);padding-bottom:env(safe-area-inset-bottom);z-index:10;backdrop-filter:blur(20px)}.tab{border:0;background:none;color:#6e819c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.tab .i{font-size:19px}.tab.active{color:#31c7ff}.fab{position:fixed;right:max(calc((100vw - 520px)/2 + 18px),18px);bottom:92px;width:56px;height:56px;border-radius:18px;border:0;color:#fff;background:linear-gradient(145deg,#247dff,#7b35f1);font-size:24px;box-shadow:0 13px 32px rgba(55,83,255,.36);z-index:8}.section-title{padding:16px 18px 8px;font-size:13px;color:#7290b6;text-transform:uppercase;letter-spacing:.08em}.profile-card{margin:16px;background:linear-gradient(145deg,#0f2846,#132e51);border:1px solid #203c61;border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px}.settings-list{margin:0 14px;background:#0a1d33;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.045)}.settings-item{display:flex;align-items:center;gap:13px;padding:15px;border-bottom:1px solid rgba(255,255,255,.05)}.settings-item:last-child{border-bottom:0}.settings-item .sicon{width:34px;height:34px;border-radius:10px;background:#183553;display:grid;place-items:center}.settings-item .grow{flex:1}.settings-item small{display:block;color:#7386a1;margin-top:2px}.story-row{display:flex;gap:13px;overflow:auto;padding:14px}.story{text-align:center;font-size:11px;color:#a8b6c9}.story .avatar{border:3px solid #514cff;box-shadow:0 0 0 2px #071426;width:58px;height:58px;margin-bottom:6px}.chat{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at top,#0e2a47,#07121f 55%)}.chat-head{height:70px;padding:8px 12px;display:flex;align-items:center;gap:10px;background:rgba(6,17,31,.95);border-bottom:1px solid rgba(255,255,255,.06);padding-top:max(env(safe-area-inset-top),8px)}.back{border:0;background:none;color:#dfeeff;font-size:25px;padding:7px}.chat-head .avatar{width:42px;height:42px;flex-basis:42px;font-size:15px}.chat-person{flex:1}.chat-person b{display:block}.online-text{color:#19d89d;font-size:11px;margin-top:2px}.messages{flex:1;overflow:auto;padding:18px 12px 16px}.bubble{max-width:80%;padding:10px 12px;border-radius:18px 18px 18px 5px;background:var(--bubble);margin:7px 0;line-height:1.4;font-size:14px;box-shadow:0 5px 12px rgba(0,0,0,.1)}.bubble.mine{margin-left:auto;background:var(--mine);border-radius:18px 18px 5px 18px}.bubble .bt{font-size:9px;color:#8ba1b9;text-align:right;margin-top:5px}.media-preview{max-width:100%;border-radius:13px;margin-top:7px}.file-card{display:flex;align-items:center;gap:9px;padding:9px;border-radius:12px;background:rgba(0,0,0,.18);margin-top:4px}.voice{display:flex;align-items:center;gap:8px}.voice button{border:0;width:33px;height:33px;border-radius:50%;background:#2c7cff;color:white}.wave{height:22px;flex:1;background:repeating-linear-gradient(90deg,#55cafa 0 2px,transparent 2px 5px);mask:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent)}.composer{display:flex;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#06111f;border-top:1px solid rgba(255,255,255,.06);align-items:flex-end}.composer textarea{flex:1;max-height:120px;resize:none;background:#10233b;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:11px 13px;color:#fff;outline:none}.circle{width:43px;height:43px;border:0;border-radius:50%;background:#17314f;color:#fff;font-size:18px}.send{background:linear-gradient(145deg,#168eff,#6a3af0)}.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:#0d2036;border-radius:26px 26px 0 0;padding:13px 16px calc(22px + env(safe-area-inset-bottom));border-top:1px solid #29405e}.handle{width:40px;height:4px;border-radius:4px;background:#52647c;margin:0 auto 18px}.attach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.attach{border:0;border-radius:16px;padding:18px 7px;background:#132b48;color:#fff}.attach span{font-size:23px;display:block;margin-bottom:7px}.modal-back{position:fixed;inset:0;background:rgba(2,7,13,.78);z-index:40;display:grid;place-items:center;padding:20px;backdrop-filter:blur(9px)}.modal{width:min(440px,100%);background:#0d2036;border:1px solid #294563;border-radius:24px;padding:20px;box-shadow:var(--shadow)}.modal h3{margin:0 0 8px}.modal p{color:#8496af;font-size:13px;line-height:1.55}.modal input{width:100%;background:#08192c;border:1px solid #29425f;color:#fff;padding:13px;border-radius:13px;margin:9px 0 14px}.modal-actions{display:flex;gap:8px}.modal-actions .btn{flex:1}.call-screen{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#0b2543,#020812 75%);display:flex;flex-direction:column;align-items:center;padding:max(env(safe-area-inset-top),35px) 22px calc(26px + env(safe-area-inset-bottom))}.call-screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65}.call-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 45%,rgba(1,7,14,.9))}.call-content{position:relative;z-index:2;text-align:center;width:100%;height:100%;display:flex;flex-direction:column;align-items:center}.call-screen .avatar{width:116px;height:116px;flex-basis:116px;font-size:38px;margin-top:13vh}.call-screen h2{font-size:30px;margin:18px 0 5px}.call-state{color:#b8c6d9}.call-controls{margin-top:auto;display:flex;gap:17px}.call-controls button{width:60px;height:60px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;backdrop-filter:blur(12px)}.call-controls .end{background:#ff405b}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:95px;z-index:100;background:#162a43;border:1px solid #2c4565;color:#fff;border-radius:14px;padding:11px 15px;max-width:88%;font-size:13px;box-shadow:var(--shadow)}.recorder{text-align:center}.mic-orb{width:120px;height:120px;border-radius:50%;margin:22px auto;background:radial-gradient(circle,#26d1ff,#4825d8 70%);display:grid;place-items:center;font-size:48px;box-shadow:0 0 0 10px rgba(55,81,255,.08),0 0 48px rgba(36,105,255,.38)}.timer{font-size:28px;font-weight:800}.mock-badge{font-size:10px;background:#5937dd;color:#fff;border-radius:10px;padding:3px 7px;margin-left:6px;vertical-align:middle}.empty{text-align:center;color:#71839c;padding:70px 30px}.status-pill{display:inline-flex;align-items:center;gap:5px;color:#13d7a5;font-size:11px}.status-pill:before{content:"";width:7px;height:7px;background:#13d7a5;border-radius:50%}@media(min-width:521px){body{padding:22px 0}.app{min-height:calc(100vh - 44px);border-radius:28px}.bottom{bottom:22px;border-radius:0 0 28px 28px}.chat{height:calc(100vh - 44px);border-radius:28px;overflow:hidden}.call-screen{max-width:520px;left:50%;transform:translateX(-50%);border-radius:28px;top:22px;bottom:22px}}
</style>

<body>
<div class="app" id="app"></div>
<input id="fileInput" type="file" hidden>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app'), toast=$('#toast');
const logo=`<div class="logo"><svg viewBox="0 0 100 100" aria-label="AIPPY Chat logo"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27e8ff"/><stop offset=".62" stop-color="#2b79ff"/><stop offset="1" stop-color="#9b45ff"/></linearGradient></defs><path d="M18 69 43 23c4-8 15-8 19 0l20 38c5 10-2 22-13 22H48L33 94l3-17h-8c-9 0-14-9-10-18Z" fill="url(#g)"/><circle cx="46" cy="61" r="4.5" fill="#071426"/><circle cx="61" cy="61" r="4.5" fill="#071426"/></svg></div>`;
const miniLogo=`<div class="mini-logo"><svg viewBox="0 0 100 100"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30e8ff"/><stop offset=".65" stop-color="#3975ff"/><stop offset="1" stop-color="#a64bff"/></linearGradient></defs><path d="M18 69 43 23c4-8 15-8 19 0l20 38c5 10-2 22-13 22H48L33 94l3-17h-8c-9 0-14-9-10-18Z" fill="url(#mg)"/><circle cx="46" cy="61" r="4.5" fill="#071426"/><circle cx="61" cy="61" r="4.5" fill="#071426"/></svg></div>`;
let user=JSON.parse(localStorage.getItem('aippyChatUser')||'null');
let contacts=JSON.parse(localStorage.getItem('aippyContacts')||'null')||[
{id:'sarah',name:'Sarah',username:'@sarah',avatar:'S',online:true,last:'Looks amazing! 🔥',time:'1:32 AM',unread:2},
{id:'team',name:'AIPPY Team',username:'@aippyteam',avatar:'A',online:true,last:'📎 File: game_plan.pdf',time:'12:45 AM',unread:1},
{id:'abdullah',name:'Abdullah',username:'@abdullah',avatar:'ع',online:true,last:'🎙 Voice message',time:'12:12 AM',unread:0},
{id:'layla',name:'Layla',username:'@layla',avatar:'L',online:false,last:'📷 Photo',time:'Yesterday',unread:0},
{id:'omar',name:'Omar',username:'@omar',avatar:'O',online:true,last:'📹 Video call · 12m',time:'Yesterday',unread:0}
];
let activeTab='chats', current=null, mediaRecorder=null, chunks=[], recTimer=null, recSeconds=0, callStream=null;
const messages={
sarah:[{mine:false,type:'text',text:'Hey 👋 welcome to AIPPY Chat',time:'1:28 AM'},{mine:false,type:'text',text:'This is a full interactive mockup — no backend connected.',time:'1:29 AM'},{mine:true,type:'text',text:'Perfect, I want to test the flow.',time:'1:30 AM'}],
team:[{mine:false,type:'text',text:'Your design files are ready.',time:'12:44 AM'},{mine:false,type:'file',name:'game_plan.pdf',size:'2.4 MB',time:'12:45 AM'}],
omar:[{mine:false,type:'text',text:'Try the audio or video call buttons above.',time:'Yesterday'}]
};
function saveContacts(){localStorage.setItem('aippyContacts',JSON.stringify(contacts))}
function showToast(t){toast.textContent=t;toast.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.add('hidden'),2400)}
function welcome(){app.innerHTML=`<div class="safe-top"></div><section class="welcome">${logo}<h1>AIPPY CHAT</h1><div class="brand-sub">FAST · SECURE · YOURS</div><p>Your private messenger experience.<br><span class="mock-badge">MOCKUP</span> No backend or real accounts are used.</p><div class="card"><div class="field"><label>Username</label><input id="username" placeholder="@yourname" autocapitalize="none"></div><div class="field"><label>Display name</label><input id="displayName" placeholder="Your name"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><button class="btn primary" id="create">Create demo account</button><button class="btn ghost" id="quick">Quick demo</button><div class="demo-note">Everything stays in this browser only.</div></div></section>`;
$('#create').onclick=()=>{const u=$('#username').value.trim().replace(/^@/,'');const n=$('#displayName').value.trim();if(!u||!n)return showToast('Enter a username and display name');user={username:'@'+u,name:n};localStorage.setItem('aippyChatUser',JSON.stringify(user));home()};
$('#quick').onclick=()=>{user={username:'@demo',name:'Demo User'};localStorage.setItem('aippyChatUser',JSON.stringify(user));home()};}
function header(title='Chats',sub=''){return `<div class="safe-top"></div><header class="topbar"><div class="top-left">${miniLogo}<div><div class="title">${title}<span class="mock-badge">DEMO</span></div>${sub?`<div class="subtitle">${sub}</div>`:''}</div></div><button class="icon-btn" id="topAction">⌕</button></header>`}
function bottom(){return `<nav class="bottom"><button class="tab ${activeTab==='chats'?'active':''}" data-tab="chats"><span class="i">◉</span>Chats</button><button class="tab ${activeTab==='calls'?'active':''}" data-tab="calls"><span class="i">☎</span>Calls</button><button class="tab ${activeTab==='status'?'active':''}" data-tab="status"><span class="i">◌</span>Status</button><button class="tab ${activeTab==='settings'?'active':''}" data-tab="settings"><span class="i">⚙</span>Settings</button></nav>`}
function bindTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;home()})}
function home(){if(!user)return welcome();if(activeTab==='chats')chats();else if(activeTab==='calls')calls();else if(activeTab==='status')statusView();else settings();}
function chats(){app.innerHTML=header('Chats',user.username)+`<main class="content"><div class="search-row"><input class="search" id="search" placeholder="Search chats"><button class="icon-btn" id="addBtn">＋</button></div><div class="filter-row"><button class="chip active">All</button><button class="chip">Unread</button><button class="chip">Groups</button><button class="chip">Archived</button></div><div class="list" id="chatList"></div></main><button class="fab" id="fab">✎</button>${bottom()}`;renderContacts();bindTabs();$('#addBtn').onclick=addUserModal;$('#fab').onclick=addUserModal;$('#search').oninput=e=>renderContacts(e.target.value);$('#topAction').onclick=()=>$('#search').focus();}
function renderContacts(q=''){const list=$('#chatList');const rows=contacts.filter(c=>(c.name+' '+c.username).toLowerCase().includes(q.toLowerCase())).map(c=>`<div class="row" data-id="${c.id}"><div class="avatar ${c.online?'online':''}">${c.avatar}</div><div class="row-main"><div class="row-top"><span class="row-name">${c.name}</span><span class="row-time">${c.time||''}</span></div><div class="row-top"><span class="preview">${c.last||c.username}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div></div></div>`).join('');list.innerHTML=rows||`<div class="empty">No chats found</div>`;list.querySelectorAll('.row').forEach(r=>r.onclick=()=>openChat(r.dataset.id));}
function addUserModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modalBack"><div class="modal"><h3>Add by username</h3><p>No phone number needed. In this mockup any username you enter creates a local demo contact.</p><input id="newUser" placeholder="@username" autocapitalize="none"><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="addUser">Add user</button></div></div></div>`);$('#cancelModal').onclick=()=>$('#modalBack').remove();$('#addUser').onclick=()=>{let v=$('#newUser').value.trim().replace(/^@/,'');if(!v)return;let c={id:'u'+Date.now(),name:v.charAt(0).toUpperCase()+v.slice(1),username:'@'+v,avatar:v.charAt(0).toUpperCase(),online:true,last:'New contact',time:'Now',unread:0};contacts.unshift(c);saveContacts();$('#modalBack').remove();showToast('User added locally');renderContacts();};}
function openChat(id){current=contacts.find(c=>c.id===id);if(!current)return;current.unread=0;saveContacts();if(!messages[id])messages[id]=[];app.innerHTML=`<section class="chat"><header class="chat-head"><button class="back" id="back">‹</button><div class="avatar ${current.online?'online':''}">${current.avatar}</div><div class="chat-person"><b>${current.name}</b><div class="online-text">${current.online?'Online':'Last seen recently'}</div></div><button class="icon-btn" id="audioCall">☎</button><button class="icon-btn" id="videoCall">▣</button></header><div class="messages" id="messages"></div><div class="composer"><button class="circle" id="attach">＋</button><textarea id="msg" rows="1" placeholder="Message"></textarea><button class="circle" id="voiceBtn">🎙</button><button class="circle send" id="send">➤</button></div></section>`;renderMessages();$('#back').onclick=home;$('#send').onclick=sendText;$('#msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};$('#attach').onclick=attachSheet;$('#voiceBtn').onclick=voiceModal;$('#audioCall').onclick=()=>startCall(false);$('#videoCall').onclick=()=>startCall(true);}
function renderMessages(){const box=$('#messages');box.innerHTML=(messages[current.id]||[]).map(m=>{let body='';if(m.type==='text')body=escapeHtml(m.text);if(m.type==='file')body=`<div class="file-card"><span>📄</span><div><b>${escapeHtml(m.name)}</b><div class="subtitle">${m.size||'File'}</div></div></div>`;if(m.type==='image')body=`<div>📷 Photo</div><img class="media-preview" src="${m.url}">`;if(m.type==='video')body=`<video class="media-preview" src="${m.url}" controls playsinline></video>`;if(m.type==='voice')body=`<div class="voice"><button onclick="this.nextElementSibling.nextElementSibling.play()">▶</button><div class="wave"></div><audio src="${m.url}"></audio><span>${m.duration||'0:07'}</span></div>`;return `<div class="bubble ${m.mine?'mine':''}">${body}<div class="bt">${m.time||'Now'} ${m.mine?'✓✓':''}</div></div>`}).join('')||`<div class="empty">Start a conversation with ${current.name}</div>`;box.scrollTop=box.scrollHeight;}
function sendText(){const el=$('#msg'),t=el.value.trim();if(!t)return;messages[current.id].push({mine:true,type:'text',text:t,time:now()});current.last=t;current.time='Now';el.value='';renderMessages();setTimeout(()=>{if(Math.random()>.35){messages[current.id].push({mine:false,type:'text',text:['Nice 👌','Got it!','Looks good 🔥','This is only a local demo reply.'][Math.floor(Math.random()*4)],time:now()});renderMessages();mockNotify(current.name,'New demo message')}} ,1000);}
function attachSheet(){document.body.insertAdjacentHTML('beforeend',`<div class="sheet-back" id="sheetBack"><div class="sheet"><div class="handle"></div><div class="attach-grid"><button class="attach" data-type="image"><span>🖼</span>Photo</button><button class="attach" data-type="video"><span>🎬</span>Video</button><button class="attach" data-type="file"><span>📄</span>Document</button></div></div></div>`);$('#sheetBack').onclick=e=>{if(e.target.id==='sheetBack')e.currentTarget.remove()};document.querySelectorAll('.attach').forEach(b=>b.onclick=()=>pickFile(b.dataset.type));}
function pickFile(type){$('#sheetBack')?.remove();const input=$('#fileInput');input.accept=type==='image'?'image/*':type==='video'?'video/*':'*/*';input.onchange=()=>{const f=input.files[0];if(!f)return;const url=URL.createObjectURL(f);if(type==='image')messages[current.id].push({mine:true,type:'image',url,time:now()});else if(type==='video')messages[current.id].push({mine:true,type:'video',url,time:now()});else messages[current.id].push({mine:true,type:'file',name:f.name,size:formatSize(f.size),time:now()});renderMessages();input.value=''};input.click();}
function voiceModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="voiceBack"><div class="modal recorder"><h3>Voice message</h3><div class="mic-orb">🎙</div><div class="timer" id="timer">0:00</div><p id="recState">Tap record to start</p><div class="modal-actions"><button class="btn" id="cancelRec">Cancel</button><button class="btn primary" id="recordBtn">Record</button></div></div></div>`);$('#cancelRec').onclick=stopAndCloseRecorder;$('#recordBtn').onclick=startRecording;}
async function startRecording(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{clearInterval(recTimer);const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'}),url=URL.createObjectURL(blob);messages[current.id].push({mine:true,type:'voice',url,duration:fmtTime(recSeconds),time:now()});stream.getTracks().forEach(t=>t.stop());$('#voiceBack')?.remove();renderMessages();};mediaRecorder.start();recSeconds=0;$('#recordBtn').textContent='Send';$('#recState').textContent='Recording…';recTimer=setInterval(()=>{recSeconds++;$('#timer').textContent=fmtTime(recSeconds)},1000)}catch(e){showToast('Microphone unavailable — added a simulated voice message');messages[current.id].push({mine:true,type:'voice',url:'',duration:'0:07',time:now()});$('#voiceBack')?.remove();renderMessages();}}
function stopAndCloseRecorder(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stream.getTracks().forEach(t=>t.stop());mediaRecorder=null}clearInterval(recTimer);$('#voiceBack')?.remove()}
function calls(){app.innerHTML=header('Calls','Recent demo calls')+`<main class="content"><div class="section-title">Recent</div><div class="list">${contacts.slice(0,4).map((c,i)=>`<div class="row" data-call="${c.id}"><div class="avatar">${c.avatar}</div><div class="row-main"><div class="row-name">${c.name}</div><div class="preview">${i%2?'↙ Incoming':'↗ Outgoing'} · ${i+2} min</div></div><button class="icon-btn">☎</button></div>`).join('')}</div></main>${bottom()}`;bindTabs();document.querySelectorAll('[data-call]').forEach(r=>r.onclick=()=>{current=contacts.find(c=>c.id===r.dataset.call);startCall(false)});}
function statusView(){app.innerHTML=header('Status','Stories mockup')+`<main class="content"><div class="section-title">Recent updates</div><div class="story-row">${contacts.slice(0,5).map(c=>`<div class="story"><div class="avatar">${c.avatar}</div>${c.name}</div>`).join('')}</div><div class="section-title">Channels</div><div class="list"><div class="row"><div class="avatar">A</div><div class="row-main"><div class="row-name">AIPPY News</div><div class="preview">New update coming soon 🚀</div></div></div><div class="row"><div class="avatar">D</div><div class="row-main"><div class="row-name">Design</div><div class="preview">Fresh UI inspiration</div></div></div></div></main>${bottom()}`;bindTabs();}
function settings(){app.innerHTML=header('Settings','Your local demo profile')+`<main class="content"><div class="profile-card"><div class="avatar online">${(user.name||'U').charAt(0).toUpperCase()}</div><div><b>${escapeHtml(user.name)}</b><div class="subtitle">${escapeHtml(user.username)}</div><div class="status-pill">Online</div></div></div><div class="settings-list"><div class="settings-item"><div class="sicon">👤</div><div class="grow"><b>Account</b><small>Username only · no phone number</small></div><span>›</span></div><div class="settings-item"><div class="sicon">🔒</div><div class="grow"><b>Privacy & Security</b><small>End-to-end encryption UI mockup</small></div><span>›</span></div><div class="settings-item" id="notify"><div class="sicon">🔔</div><div class="grow"><b>Notifications</b><small>Enable and test browser notifications</small></div><span>›</span></div><div class="settings-item"><div class="sicon">🗂</div><div class="grow"><b>Data & Storage</b><small>Photos, videos and documents</small></div><span>›</span></div><div class="settings-item"><div class="sicon">◐</div><div class="grow"><b>Appearance</b><small>Dark theme</small></div><span>›</span></div><div class="settings-item" id="logout"><div class="sicon">↪</div><div class="grow"><b>Reset demo</b><small>Clear local profile and contacts</small></div><span>›</span></div></div></main>${bottom()}`;bindTabs();$('#notify').onclick=requestNotifications;$('#logout').onclick=()=>{if(confirm('Reset this local demo?')){localStorage.removeItem('aippyChatUser');localStorage.removeItem('aippyContacts');user=null;location.reload()}};}
async function requestNotifications(){if(!('Notification'in window))return showToast('Browser notifications are not supported here');let p=Notification.permission;if(p!=='granted')p=await Notification.requestPermission();if(p==='granted'){new Notification('AIPPY Chat',{body:'Push-style notification test is working.'});showToast('Test notification sent')}else showToast('Notification permission was not granted')}
function mockNotify(title,body){if(document.hidden&&'Notification'in window&&Notification.permission==='granted')new Notification(title,{body})}
async function startCall(video){if(!current)current=contacts[0];document.body.insertAdjacentHTML('beforeend',`<div class="call-screen" id="callScreen"><video id="selfVideo" class="hidden" autoplay muted playsinline></video><div class="call-shade"></div><div class="call-content"><div class="avatar">${current.avatar}</div><h2>${current.name}</h2><div class="call-state">${video?'Video':'Audio'} call · mock connection</div><div class="call-controls"><button id="muteCall">🎙</button>${video?'<button id="camCall">▣</button>':''}<button id="speakerCall">🔊</button><button class="end" id="endCall">☎</button></div></div></div>`);if(video){try{callStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const v=$('#selfVideo');v.srcObject=callStream;v.classList.remove('hidden')}catch(e){showToast('Camera permission denied — call UI still works')}}else{try{callStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){}}$('#endCall').onclick=endCall;$('#muteCall').onclick=e=>{if(callStream){const tracks=callStream.getAudioTracks();tracks.forEach(t=>t.enabled=!t.enabled);e.currentTarget.textContent=tracks[0]?.enabled?'🎙':'🔇'}};$('#camCall')&&($('#camCall').onclick=e=>{if(callStream){const t=callStream.getVideoTracks()[0];if(t){t.enabled=!t.enabled;e.currentTarget.textContent=t.enabled?'▣':'⊘'}}});}
function endCall(){if(callStream)callStream.getTracks().forEach(t=>t.stop());callStream=null;$('#callScreen')?.remove()}
function now(){return new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function fmtTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});home();
</script>
</body>
