<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07100a">
<title>Forest Stalker V5.9</title>
<link rel="stylesheet" href="style.css?v=59">
</head>
<body>
<canvas id="g"></canvas>
<div class="scope"><div class="mask"></div><div class="glass"></div><div class="ret"></div><div class="read">6× SCOPE</div></div>
<header>
  <div><small>HUNTED</small><b id="score">0</b></div>
  <div><small>COINS</small><b><i class="coinIcon"></i><span id="coins">0</span></b></div>
  <div><small>RANGE</small><b id="range">-- m</b></div>
</header>
<div class="mini"><span id="gunName">RANGER .308</span><span><b id="bag">0/5</b> BAG</span><span id="acc">100%</span></div>
<div class="controls"><button id="shopBtn">SHOP</button><button id="reload">RELOAD</button><div class="ammo"><b id="ammo">5</b>/<span id="reserve">∞</span></div><button id="fire">FIRE</button></div>
<div class="msg" id="msg"></div><div class="dmg" id="dmg"></div>
<div class="intro" id="intro"><div class="card"><h1>FOREST <em>STALKER</em></h1><p>Infinite deer hunting. Scan the full 360° forest, keep your crosshair on the deer, harvest up to 5 deer, sell your bag, and upgrade your rifle.</p><button id="start">LOADING…</button></div></div>
<div id="shop" class="shop"><div class="shopCard">
  <div class="shopHead"><div><small>HUNTER STORE</small><h2>RIFLES</h2></div><div class="shopBalance"><i class="coinIcon"></i><span id="shopCoins">0</span></div><button id="closeShop">×</button></div>
  <div class="sellBox"><div><b><span id="sellCount">0</span>/5 DEER</b><small>Sell harvested deer for 90 coins each</small></div><button id="sell">SELL · <i class="coinIcon tiny"></i><span id="sellValue">0</span></button></div>
  <div id="rifles" class="rifles"></div>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script src="audio59.js?v=59"></script>
<script type="module" src="game56-loader.js?v=59"></script>
<script type="module" src="anim59.js?v=59"></script>
</body>
</html>
