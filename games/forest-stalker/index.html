<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07100a">
  <title>Forest Stalker V5</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <canvas id="g"></canvas>

  <div class="scope" aria-hidden="true">
    <div class="scopeMask"></div>
    <div class="scopeGlass"></div>
    <div class="reticle"></div>
    <div class="scopeRead" id="scopeRead">6× · -- m</div>
  </div>

  <header class="hudTop">
    <div class="hudChip scoreChip">
      <small>HUNTS</small>
      <strong id="kills">0</strong>
    </div>
    <div class="targetHud" id="targetHud">
      <div class="targetLine"><span id="targetName">DEER</span><b id="targetHpText">100</b></div>
      <div class="hpTrack"><i id="targetHpFill"></i></div>
    </div>
    <div class="hudChip coinChip">
      <small>COINS</small>
      <strong>◉ <span id="coins">0</span></strong>
    </div>
  </header>

  <div class="inventoryPill">🦌 <span id="bag">0</span> harvested</div>
  <div class="message" id="message"></div>
  <div class="damage" id="damage"></div>
  <div class="hitMark" id="hitMark"></div>
  <div class="blood" id="blood"></div>
  <div class="shotFlash" id="shotFlash"></div>

  <div class="ammoPill"><strong id="ammo">5</strong><span>/</span><b id="reserve">∞</b></div>
  <div class="weaponPill" id="weaponPill">RANGER .243</div>

  <div class="controls">
    <div class="leftDock">
      <button class="ctrl small" id="shopBtn">SHOP</button>
      <button class="ctrl small" id="reloadBtn">RELOAD</button>
    </div>
    <button class="ctrl fire" id="fireBtn">FIRE</button>
  </div>

  <section class="shop" id="shop" aria-hidden="true">
    <div class="shopSheet">
      <div class="shopHeader">
        <div><small>OUTPOST</small><h2>Hunting Shop</h2></div>
        <button id="closeShop" class="closeBtn">✕</button>
      </div>

      <div class="sellBox">
        <div>
          <small>HARVESTED DEER</small>
          <strong><span id="shopBag">0</span> × 45 coins</strong>
        </div>
        <button id="sellAllBtn">SELL ALL</button>
      </div>

      <div class="sectionTitle"><span>SNIPER RIFLES</span><b>◉ <span id="shopCoins">0</span></b></div>
      <div class="rifleList" id="rifleList"></div>
    </div>
  </section>

  <div class="boot" id="boot">
    <div class="bootInner"><span>FOREST</span><b>STALKER</b><small>ENDLESS HUNT</small></div>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
  <script type="module" src="game.js?v=5"></script>
</body>
</html>
